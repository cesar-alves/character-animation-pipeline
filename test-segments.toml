[meta]
reference_host = "linux-x86_64 container (Python 3, Blender 5.2 headless)"
universe = ["python3", "-c", '''
import unittest
def flatten(suite):
    for item in suite:
        if isinstance(item, unittest.TestSuite):
            yield from flatten(item)
        else:
            yield item
for test in flatten(unittest.defaultTestLoader.discover("tests")):
    print(test.id())
print("tests/e2e.sh")
print("tests/e2e_fit.sh")
''']

[[segment]]
id = "unit"
title = "Unit tests"
kind = "test"
run = ["python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
list = ["python3", "-c", '''
import unittest
def flatten(suite):
    for item in suite:
        if isinstance(item, unittest.TestSuite):
            yield from flatten(item)
        else:
            yield item
for test in flatten(unittest.defaultTestLoader.discover("tests")):
    print(test.id())
''']
expected_s = 0.1
tests = 25
default = true
graphical = false
nightly = false
requires = []
notes = "Pure-python unit tests using temporary fixtures; no Blender, no network, no display."

